<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Đặt Phòng Học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    
    <div class="container mt-4 bg-white p-4 shadow rounded">
        <h2 class="text-center mb-4 fw-bold">QUẢN LÝ ĐẶT PHÒNG HỌC</h2>
        
        <button class="btn btn-success fw-bold mb-3" onclick="moPopup()">+ Thêm đặt phòng</button>
        
        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-dark text-center">
                    <tr>
                        <th>Mã đặt</th>
                        <th>Họ tên</th>
                        <th>Mã SV</th>
                        <th>Phòng</th>
                        <th>Số lượng</th>
                        <th>Ngày</th>
                        <th>Ca</th>
                        <th>Hình thức</th>
                        <th style="width: 130px;">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="bangDuLieu"></tbody>
            </table>
        </div>

        <div class="mt-4">
            <p class="fw-bold mb-2">Tổng số lượt đặt: <span id="stat-tong" class="fw-normal">0</span></p>
            <p class="fw-bold mb-2">Thường: <span id="stat-thuong" class="fw-normal">0</span></p>
            <p class="fw-bold mb-2">Ưu tiên: <span id="stat-uutien" class="fw-normal">0</span></p>
        </div>
    </div>

    <div class="modal-overlay" id="popupForm">
        <div class="modal-box shadow">
            <h3 id="form-title" class="text-center mb-4 fw-bold">THÊM ĐẶT PHÒNG</h3>
            
            <form id="roomForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Mã đặt phòng (PH-XXXX):</label>
                        <input type="text" id="maDat" class="form-control">
                        <span id="err-maDat" class="error-text"></span>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Họ tên người đặt:</label>
                        <input type="text" id="hoTen" class="form-control">
                        <span id="err-hoTen" class="error-text"></span>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Mã sinh viên (SV + 6 số):</label>
                        <input type="text" id="maSV" class="form-control">
                        <span id="err-maSV" class="error-text"></span>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Phòng học:</label>
                        <select id="phong" class="form-select">
                            <option value="A101">A101</option><option value="A102">A102</option>
                            <option value="B201">B201</option><option value="B202">B202</option>
                            <option value="C303">C303</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Số lượng thành viên (2-8):</label>
                        <input type="number" id="soLuong" class="form-control">
                        <span id="err-soLuong" class="error-text"></span>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Ngày sử dụng:</label>
                        <input type="date" id="ngay" class="form-control">
                        <span id="err-ngay" class="error-text"></span>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Ca học:</label>
                        <select id="caHoc" class="form-select">
                            <option value="Ca 1">Ca 1</option>
                            <option value="Ca 2">Ca 2</option>
                            <option value="Ca 3">Ca 3</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Hình thức đặt:</label>
                        <select id="hinhThuc" class="form-select">
                            <option value="Thường">Thường</option>
                            <option value="Ưu tiên">Ưu tiên</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Email liên hệ (@sv.haui.edu.vn):</label>
                        <input type="text" id="email" class="form-control">
                        <span id="err-email" class="error-text"></span>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="fw-bold mb-1">Mục đích sử dụng:</label>
                        <textarea id="mucDich" class="form-control" rows="2"></textarea>
                        <span id="err-mucDich" class="error-text"></span>
                    </div>
                </div>
                
                <div class="mt-2">
                    <button type="button" class="btn btn-primary fw-bold px-4" onclick="luuDuLieu()">Lưu</button>
                    <button type="button" class="btn btn-secondary fw-bold px-4 ms-2" onclick="dongPopup()">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
