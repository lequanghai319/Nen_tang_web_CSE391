<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations & Transitions</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <div class="container">
        <h1 class="fade-in-element">Bài B2: Hiệu ứng CSS Animations</h1>

        <div class="demo-section fade-in-element" style="animation-delay: 0.2s;">
            <h2>Loading Spinner</h2>
            <div class="spinner"></div>
        </div>

        <div class="demo-section fade-in-element" style="animation-delay: 0.4s;">
            <h2>Product Card Hover</h2>
            
            <div class="card">
                <div class="image-container">
                    <img src="https://via.placeholder.com/300x200?text=Product+Image" alt="Sản phẩm">
                </div>
                
                <div class="card-body">
                    <h3>Sản phẩm Cao Cấp</h3>
                    <p>Mô tả ngắn gọn về sản phẩm ở đây.</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
            </div>
            
        </div>
    </div>

</body>
</html>
