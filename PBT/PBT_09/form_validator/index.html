<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Đăng ký</h2>
    <form id="regForm">
        <div class="form-group">
            <label>Tên</label>
            <input type="text" id="nameInput">
            <span id="nameIcon"></span>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="text" id="emailInput">
            <div class="error" id="emailError">Email không hợp lệ</div>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="pwdInput">
            <div class="strength-bar" id="pwdBar"></div>
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmInput">
            <div class="error" id="confirmError">Mật khẩu không khớp</div>
        </div>
        <div class="form-group">
            <label>SĐT</label>
            <input type="text" id="phoneInput" placeholder="0xxx-xxx-xxx">
        </div>
        <button type="submit" id="submitBtn" disabled>Đăng ký</button>
    </form>
    <script src="app.js"></script>
</body>
</html>
