<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div>
            <input type="text" id="searchInput" placeholder="Tìm sản phẩm...">
            <select id="sortSelect">
                <option value="default">Mặc định</option>
                <option value="price-asc">Giá tăng dần</option>
                <option value="price-desc">Giá giảm dần</option>
            </select>
            <button id="darkToggle">Dark Mode</button>
        </div>
        <div>Giỏ hàng <span id="cartCount" class="cart-badge">0</span></div>
    </div>
    <div id="categoryFilters">
        <button data-cat="all">Tất cả</button>
        <button data-cat="phone">Điện thoại</button>
        <button data-cat="laptop">Laptop</button>
    </div>
    <div class="grid" id="productGrid"></div>

    <script src="app.js"></script>
</body>
</html>
