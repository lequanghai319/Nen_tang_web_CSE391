<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial; padding: 20px; transition: 0.3s; }
        .dark-mode { background: #222; color: white; }
        .header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { border: 1px solid #ddd; padding: 15px; text-align: center; border-radius: 8px; }
        .dark-mode .card { border-color: #444; }
        img { max-width: 100%; height: 150px; object-fit: cover; }
        .cart-badge { background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px; }
        /* CSS Modal đơn giản */
        .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
        .modal { background: white; padding: 20px; border-radius: 8px; min-width: 300px; color: black; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <input type="text" id="searchInput" placeholder="Tìm sản phẩm...">
            <select id="sortSelect">
                <option value="default">Mặc định</option>
                <option value="price-asc">Giá tăng dần</option>
                <option value="price-desc">Giá giảm dần</option>
            </select>
            <button id="darkToggle">Dark Mode</button>
        </div>
        <div>Giỏ hàng <span id="cartCount" class="cart-badge">0</span></div>
    </div>
    <div id="categoryFilters">
        <button data-cat="all">Tất cả</button>
        <button data-cat="phone">Điện thoại</button>
        <button data-cat="laptop">Laptop</button>
    </div>
    <div class="grid" id="productGrid"></div>

    <script src="app.js"></script>
</body>
</html>
