<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vanilla JS Todo App</title>
    <style>
        body { font-family: sans-serif; background: #f5f5f5; display: flex; justify-content: center; padding: 50px; }
        .app { background: white; padding: 20px; border-radius: 8px; width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; }
        ul { list-style: none; padding: 0; }
        li { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #ddd; align-items: center; }
        .completed span { text-decoration: line-through; color: #888; }
        .todo-text { cursor: pointer; flex: 1; }
        .delete-btn { background: none; border: none; cursor: pointer; }
        .filters { margin-top: 15px; display: flex; justify-content: space-between; font-size: 14px; }
        button { cursor: pointer; }
    </style>
</head>
<body>
    <div class="app">
        <h2>Todo List</h2>
        <form id="todoForm">
            <input type="text" id="todoInput" placeholder="What needs to be done?">
        </form>
        <ul id="todoList"></ul>
        <div class="filters">
            <span id="count">0 items left</span>
            <div>
                <button class="filter-btn" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <button id="clearCompleted">Clear completed</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
