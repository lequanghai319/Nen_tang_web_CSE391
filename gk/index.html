<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Thư viện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <div class="menu-btn" onclick="chuyenTrang('trang-them')">Thêm sách</div>
        <div class="menu-btn" onclick="chuyenTrang('trang-quan-ly')">Quản lý thư viện</div>

        <div id="trang-them" style="display: none;">
            <h1 class="page-title" id="form-title">Thêm sách</h1>
            
            <form id="bookForm">
                <div class="row">
                    <div class="col-md-6 mb-3"> //thư viện bootsctrap chia bố cục 2 cột md tạo khoảng cách mb
                        <label class="fw-bold mb-1">Mã sách:</label>
                        <input type="text" id="maSach" class="form-control" required>
                        <span id="err-maSach" class="error-text"></span>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Tên sách:</label>
                        <input type="text" id="tenSach" class="form-control">
                        <span id="err-tenSach" class="error-text"></span>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Tác giả:</label>
                        <input type="text" id="tacGia" class="form-control">
                        <span id="err-tacGia" class="error-text"></span>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Thể loại:</label>
                        <select id="theLoai" class="form-select">
                            <option value="Khoa học">Khoa học</option>
                            <option value="Văn học">Văn học</option>
                            <option value="Lịch sử">Lịch sử</option>
                            <option value="Công nghệ">Công nghệ</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Năm xuất bản:</label>
                        <input type="number" id="namXB" class="form-control">
                        <span id="err-namXB" class="error-text"></span>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Số lượng:</label>
                        <input type="number" id="soLuong" class="form-control">
                        <span id="err-soLuong" class="error-text"></span>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Tên người thêm:</label>
                        <input type="text" id="nguoiThem" class="form-control">
                        <span id="err-nguoiThem" class="error-text"></span>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Mã xác thực:</label>
                        <input type="text" id="maXacThuc" class="form-control">
                        <span id="err-maXacThuc" class="error-text"></span>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="fw-bold mb-1">Xác nhận mã:</label>
                        <input type="text" id="xacNhanMa" class="form-control">
                        <span id="err-xacNhanMa" class="error-text"></span>
                    </div>
                </div>
                
                <button type="button" class="btn-submit-green" onclick="xuLyLuuSach()">Thêm sách</button>
            </form>
        </div>


        <div id="trang-quan-ly">
            <h1 class="page-title">Quản lý thư viện</h1>

            <div class="mb-4">
                <label class="mb-2" style="font-size: 15px;">Tìm kiếm theo tên hoặc mã sách:</label>
                <input type="text" id="oTimKiem" class="form-control" onkeyup="timKiemSach()">
            </div>

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Mã sách</th>
                            <th>Tên sách</th>
                            <th>Tác giả</th>
                            <th>Thể loại</th>
                            <th>Năm</th>
                            <th>Số lượng</th>
                            <th>Người thêm</th>
                            <th>Ngày thêm</th>
                            <th style="width: 90px; text-align: center;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="bangDuLieu">
                        </tbody>
                </table>
            </div>

            <div class="stats-area">
                <p>Tổng số sách: <span id="stat-tong">0</span></p>
                <p>Khoa học: <span id="stat-kh">0</span></p>
                <p>Văn học: <span id="stat-vh">0</span></p>
                <p>Lịch sử: <span id="stat-ls">0</span></p>
                <p>Công nghệ: <span id="stat-cn">0</span></p>
                <p>Khác: <span id="stat-khac">0</span></p>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
